<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E8A92">
  <title>Sprocket</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg">
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="dark">
  <header class="topbar">
    <div class="brand">Sprocket <span class="verchip">1.3.0</span></div>
    <div class="tools">
      <button type="button" id="dark-btn">Dark</button>
      <button type="button" id="mode-btn">Big type</button>
    </div>
  </header>
  <main id="app">
    <div class="wrap">
      <div class="card">
        <h1>Shop desk</h1>
        <p class="muted">If this message stays, app.js did not load. Open Sprocket.html or hard-refresh.</p>
      </div>
    </div>
  </main>
  <nav class="nav" aria-label="Main">
    <button type="button" class="on" data-tab="home"><span>⌂</span>Home</button>
    <button type="button" data-tab="convert"><span>↔</span>Convert</button>
    <button type="button" data-tab="stock"><span>■</span>Stock</button>
    <button type="button" data-tab="timers"><span>⏱</span>Timers</button>
    <button type="button" data-tab="help"><span>?</span>Help</button>
    <button type="button" data-tab="more"><span>⚙</span>More</button>
  </nav>
  <script src="./app.js"></script>
</body>
</html>
